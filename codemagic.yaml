workflows:
  android-debug-and-tests:
    name: Stock+ - Pruebas y APK Debug
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Preparar Gradle Wrapper y Keystore Debug
        script: |
          set -e
          cd "${CM_BUILD_DIR:-.}"
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null \
              || base64 -D -i debug.keystore.base64 -o debug.keystore 2>/dev/null \
              || python3 -c "import base64, pathlib; pathlib.Path('debug.keystore').write_bytes(base64.b64decode(pathlib.Path('debug.keystore.base64').read_text().strip()))" \
              || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            KEYTOOL_BIN="$(command -v keytool || echo "${JAVA_HOME}/bin/keytool")"
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
      - name: Ejecutar pruebas unitarias y Robolectric
        script: |
          cd "${CM_BUILD_DIR:-.}"
          ./gradlew :app:testDebugUnitTest
      - name: Compilar APK Debug
        script: |
          set -e
          cd "${CM_BUILD_DIR:-.}"
          if [ ! -s debug.keystore ]; then
            KEYTOOL_BIN="$(command -v keytool || echo "${JAVA_HOME}/bin/keytool")"
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/tests/**/*

  android-release:
    name: Stock+ - APK/AAB Release
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Preparar entorno de firma y compilación
        script: |
          set -e
          cd "${CM_BUILD_DIR:-.}"
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null \
              || base64 -D -i debug.keystore.base64 -o debug.keystore 2>/dev/null \
              || python3 -c "import base64, pathlib; pathlib.Path('debug.keystore').write_bytes(base64.b64decode(pathlib.Path('debug.keystore.base64').read_text().strip()))" \
              || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            KEYTOOL_BIN="$(command -v keytool || echo "${JAVA_HOME}/bin/keytool")"
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

          if [ -n "$CM_KEYSTORE_PATH" ] && [ -s "$CM_KEYSTORE_PATH" ]; then
            cp "$CM_KEYSTORE_PATH" my-upload-key.jks
            RELEASE_STORE_PASS="${CM_KEYSTORE_PASSWORD:-${STORE_PASSWORD:-stockplus2026}}"
            RELEASE_KEY_PASS="${CM_KEY_PASSWORD:-${KEY_PASSWORD:-$RELEASE_STORE_PASS}}"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks 2>/dev/null \
              || python3 -c "import base64, os, pathlib; pathlib.Path('my-upload-key.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"
            RELEASE_STORE_PASS="${STORE_PASSWORD:-stockplus2026}"
            RELEASE_KEY_PASS="${KEY_PASSWORD:-$RELEASE_STORE_PASS}"
          elif [ -s my-upload-key.jks ]; then
            RELEASE_STORE_PASS="${STORE_PASSWORD:-stockplus2026}"
            RELEASE_KEY_PASS="${KEY_PASSWORD:-$RELEASE_STORE_PASS}"
          else
            KEYTOOL_BIN="$(command -v keytool || echo "${JAVA_HOME}/bin/keytool")"
            RELEASE_STORE_PASS="${STORE_PASSWORD:-stockplus2026}"
            RELEASE_KEY_PASS="${KEY_PASSWORD:-$RELEASE_STORE_PASS}"
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -storepass "$RELEASE_STORE_PASS" \
              -alias upload \
              -keypass "$RELEASE_KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=StockPlus,O=PedritoTech,C=CU"
          fi
          ls -lh my-upload-key.jks
          if [ -n "$CM_ENV" ]; then
            echo "KEYSTORE_PATH=${CM_BUILD_DIR:-$(pwd)}/my-upload-key.jks" >> "$CM_ENV"
            echo "STORE_PASSWORD=$RELEASE_STORE_PASS" >> "$CM_ENV"
            echo "KEY_PASSWORD=$RELEASE_KEY_PASS" >> "$CM_ENV"
          fi
      - name: Compilar APK y AAB Release
        script: |
          set -e
          cd "${CM_BUILD_DIR:-.}"
          if [ ! -s my-upload-key.jks ]; then
            KEYTOOL_BIN="$(command -v keytool || echo "${JAVA_HOME}/bin/keytool")"
            RELEASE_STORE_PASS="${STORE_PASSWORD:-stockplus2026}"
            RELEASE_KEY_PASS="${KEY_PASSWORD:-$RELEASE_STORE_PASS}"
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -storepass "$RELEASE_STORE_PASS" \
              -alias upload \
              -keypass "$RELEASE_KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=StockPlus,O=PedritoTech,C=CU"
          fi
          export KEYSTORE_PATH="${KEYSTORE_PATH:-${CM_BUILD_DIR:-$(pwd)}/my-upload-key.jks}"
          export STORE_PASSWORD="${STORE_PASSWORD:-${CM_KEYSTORE_PASSWORD:-stockplus2026}}"
          export KEY_PASSWORD="${KEY_PASSWORD:-${CM_KEY_PASSWORD:-$STORE_PASSWORD}}"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/reports/tests/**/*
