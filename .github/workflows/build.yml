name: Stock+ - Pruebas y APK Debug

on:
  push:
    branches: [feature/licensehub-integration]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar keystore debug y Gradle Wrapper
        run: |
          set -e
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Ejecutar pruebas unitarias y Robolectric
        run: ./gradlew :app:testDebugUnitTest

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: stockplus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
