name: Stock+ - Pruebas y APK Debug

on:
  push:
    branches: [feature/licensehub-integration]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION_CODE: ${{ github.run_number + 1000 }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar las llaves de firma permanentes
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -e
          base64 -d debug.keystore.base64 > debug.keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" > /dev/null
          echo "Llaves listas y verificadas."
          chmod +x gradlew

      - name: Ejecutar pruebas unitarias y Robolectric
        run: ./gradlew :app:testDebugUnitTest

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug

      - name: Compilar APK de publicación
        run: ./gradlew :app:assembleRelease

      - name: Subir el APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: stockplus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir el APK de publicación
        uses: actions/upload-artifact@v4
        with:
          name: stockplus-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
