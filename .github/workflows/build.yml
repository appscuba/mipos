name: Stock+ - Pruebas y APK Debug

on:
  push:
    branches: [feature/licensehub-integration]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Calcular el código de versión
        run: echo "BUILD_VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar las llaves de firma permanentes
        run: |
          set -e
          base64 -d debug.keystore.base64 > debug.keystore
          base64 -d my-upload-key.jks.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STORE_PASSWORD > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" > /dev/null
          echo "Llaves listas y verificadas."
          chmod +x gradlew

      - name: Ejecutar pruebas unitarias y Robolectric
        run: ./gradlew :app:testDebugUnitTest

      - name: Subir el informe de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results/**
            app/build/reports/**
          if-no-files-found: ignore
      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug

      - name: Compilar APK de publicación
        run: ./gradlew :app:assembleRelease

      - name: Subir el APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: stockplus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir el APK de publicación
        uses: actions/upload-artifact@v4
        with:
          name: stockplus-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
