name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Compilar y testear (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generar keystore debug
        run: |
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Tests unitarios y Robolectric + APK debug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Subir APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
